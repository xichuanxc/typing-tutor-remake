name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python3 scripts/verify-tt-analysis.py
      - run: python3 scripts/package-web.py
      - uses: actions/upload-artifact@v4
        with:
          name: typing-tutor-remake-web
          path: artifacts/*
