<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Typing Tutor IV</title><meta name="description" content="A faithful local reconstruction of the Typing Tutor IV menus, settings and practice scoring.">
<link rel="stylesheet" href="./style.css"></head>
<body>
<h1 class="sr-only" id="screen-title">Main Menu</h1>
<main id="viewport" aria-labelledby="screen-title" aria-describedby="screen-text">
<div id="terminal" tabindex="0" aria-label="Typing Tutor keyboard screen">
<div id="cells" aria-hidden="true"></div><div id="controls"></div>
</div>
</main>
<pre id="screen-text" class="sr-only"></pre>
<p id="screen-status" class="sr-only" role="status" aria-live="polite"></p>
<div class="browser-tools"><span id="session-note">Left / Right: choose · Enter: select · Esc: return</span>
<nav aria-label="Browser tools"><input type="file" id="disk-files" accept=".tst,.txt,text/plain" multiple hidden><button type="button" id="choose-disk-files" hidden>Choose local test files</button><button type="button" id="export-data">Export browser data</button><a href="./prototype/">Earlier typing prototype</a></nav></div>
<p class="browser-note">Use Quit to save your settings and practice before closing this page.</p>
<script type="module" src="./app.js"></script>
</body></html>
